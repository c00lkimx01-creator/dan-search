<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - ページが見つかりません</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="home-page">
        <div class="home-wrapper" style="text-align: center;">
            <h1 style="font-size: 64px; margin-bottom: 20px; color: #4F46E5;">404</h1>
            <h2 style="font-size: 24px; margin-bottom: 16px; color: var(--text-primary);">ページが見つかりません</h2>
            <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 16px;">
                申し訳ありませんが、お探しのページが見つかりました。
            </p>
            <a href="/" style="
                display: inline-block;
                padding: 10px 24px;
                background-color: #F8F9FA;
                border: 1px solid var(--border);
                border-radius: 4px;
                color: var(--text-primary);
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                transition: all 0.2s;
            " onmouseover="this.style.boxShadow='0 1px 3px rgba(0, 0, 0, 0.12)'" onmouseout="this.style.boxShadow='none'">
                ホームに戻る
            </a>
        </div>
    </div>
</body>
</html>
