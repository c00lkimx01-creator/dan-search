<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAN Search - 次世代検索エンジン</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%234F46E5;stop-opacity:1' /><stop offset='100%' style='stop-color:%237C3AED;stop-opacity:1' /></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='65' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='system-ui'>D</text></svg>">
</head>
<body>
    <!-- SVGスプライト（使用するアイコン） -->
    <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 検索アイコン -->
            <symbol id="icon-search" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="m21 21-4.35-4.35" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- クリアアイコン -->
            <symbol id="icon-clear" viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/>
                <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- 画像アイコン -->
            <symbol id="icon-image" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                <polyline points="21 15 16 10 5 21" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- 動画アイコン -->
            <symbol id="icon-video" viewBox="0 0 24 24">
                <polygon points="23 7 16 12 23 17 23 7" fill="currentColor"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- 太陽（ライトモード）アイコン -->
            <symbol id="icon-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
                <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- 月（ダークモード）アイコン -->
            <symbol id="icon-moon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- 矢印（戻る）アイコン -->
            <symbol id="icon-arrow-left" viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
            
            <!-- 設定アイコン -->
            <symbol id="icon-settings" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 1v6m0 6v6m-8.07-2.93l4.24-4.24m2.83 9.5l4.24-4.24m8.07-2.93h-6m-6-0h-6m2.93-8.07l4.24 4.24m2.83 9.5L6.17 14.76" fill="none" stroke="currentColor" stroke-width="2"/>
            </symbol>
        </defs>
    </svg>

    <!-- ホームページ -->
    <div class="home-page" id="homePage">
        <!-- 背景デコレーション -->
        <svg class="background-svg" viewBox="0 0 1200 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.05" />
                    <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.05" />
                </linearGradient>
                <filter id="blur">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
                </filter>
            </defs>
            <rect width="1200" height="800" fill="url(#bgGradient)"/>
            <!-- 装飾用円 -->
            <circle cx="100" cy="50" r="80" fill="#4F46E5" opacity="0.1" filter="url(#blur)"/>
            <circle cx="1100" cy="750" r="120" fill="#7C3AED" opacity="0.1" filter="url(#blur)"/>
            <circle cx="600" cy="400" r="90" fill="#06B6D4" opacity="0.05" filter="url(#blur)"/>
        </svg>

        <div class="home-container">
            <!-- ロゴセクション -->
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#4F46E5" />
                            <stop offset="50%" style="stop-color:#7C3AED" />
                            <stop offset="100%" style="stop-color:#06B6D4" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- 背景円 -->
                    <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1" filter="url(#glow)"/>
                    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3"/>
                    
                    <!-- 検索アイコン要素 -->
                    <g class="logo-icon">
                        <circle cx="80" cy="80" r="35" fill="none" stroke="url(#logoGradient)" stroke-width="3"/>
                        <line x1="110" y1="110" x2="140" y2="140" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round"/>
                    </g>
                    
                    <!-- テキスト -->
                    <text x="100" y="165" font-size="32" font-weight="bold" text-anchor="middle" fill="url(#logoGradient)" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-1">DAN</text>
                </svg>
                <h1 class="logo-text">DAN Search</h1>
                <p class="tagline">次世代の検索体験</p>
            </div>

            <!-- 検索ボックス -->
            <div class="search-wrapper">
                <div class="search-box-container">
                    <div class="search-box">
                        <svg class="search-icon" width="20" height="20">
                            <use xlink:href="#icon-search"></use>
                        </svg>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="何をお探しですか？"
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <button class="clear-btn" id="clearBtn" style="display: none;" title="クリア">
                            <svg class="clear-icon" width="18" height="18">
                                <use xlink:href="#icon-clear"></use>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- 検索ボタン -->
                    <button class="search-btn-home" id="searchBtn">
                        <span>検索</span>
                        <svg class="btn-icon" width="16" height="16">
                            <use xlink:href="#icon-search"></use>
                        </svg>
                    </button>
                </div>

                <!-- 検索タイプスイッチ -->
                <div class="search-type-switch">
                    <label class="switch-label">
                        <input type="radio" name="searchType" value="web" checked>
                        <span class="switch-option">
                            <svg width="16" height="16"><use xlink:href="#icon-search"></use></svg>
                            ウェブ
                        </span>
                    </label>
                    <label class="switch-label">
                        <input type="radio" name="searchType" value="image">
                        <span class="switch-option">
                            <svg width="16" height="16"><use xlink:href="#icon-image"></use></svg>
                            画像
                        </span>
                    </label>
                    <label class="switch-label">
                        <input type="radio" name="searchType" value="video">
                        <span class="switch-option">
                            <svg width="16" height="16"><use xlink:href="#icon-video"></use></svg>
                            動画
                        </span>
                    </label>
                </div>
            </div>

            <!-- フッター -->
            <footer class="home-footer">
                <button class="theme-toggle" id="themeToggle" title="テーマ切り替え">
                    <svg class="theme-icon" width="20" height="20">
                        <use xlink:href="#icon-sun"></use>
                    </svg>
                </button>
            </footer>
        </div>
    </div>

    <!-- 検索結果ページ -->
    <div class="results-page" id="resultsPage" style="display: none;">
        <!-- ヘッダー -->
        <header class="results-header">
            <div class="header-content">
                <button class="back-btn" id="backBtn" title="戻る">
                    <svg width="20" height="20">
                        <use xlink:href="#icon-arrow-left"></use>
                    </svg>
                </button>
                
                <div class="header-logo">
                    <svg class="logo-mini" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4F46E5" />
                                <stop offset="100%" style="stop-color:#7C3AED" />
                            </linearGradient>
                        </defs>
                        <circle cx="100" cy="100" r="35" fill="none" stroke="url(#logoGradient2)" stroke-width="2"/>
                        <line x1="125" y1="125" x2="145" y2="145" stroke="url(#logoGradient2)" stroke-width="2"/>
                        <text x="100" y="155" font-size="20" font-weight="bold" text-anchor="middle" fill="url(#logoGradient2)" font-family="system-ui">DAN</text>
                    </svg>
                </div>

                <div class="header-search">
                    <div class="search-box-small">
                        <svg class="search-icon" width="18" height="18">
                            <use xlink:href="#icon-search"></use>
                        </svg>
                        <input 
                            type="text" 
                            id="searchInputHeader" 
                            class="search-input-small" 
                            placeholder="再度検索..."
                            autocomplete="off"
                        >
                        <button class="search-btn-small" id="searchBtnHeader">
                            <svg width="16" height="16"><use xlink:href="#icon-search"></use></svg>
                        </button>
                    </div>
                </div>

                <button class="theme-toggle" id="themeToggleResults" title="テーマ切り替え">
                    <svg class="theme-icon" width="20" height="20">
                        <use xlink:href="#icon-sun"></use>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 検索情報 -->
        <div class="search-info">
            <div class="info-top">
                <span class="result-stats" id="resultStats"></span>
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-type="web">
                    <svg width="16" height="16"><use xlink:href="#icon-search"></use></svg>
                    全て
                </button>
                <button class="filter-tab" data-type="image">
                    <svg width="16" height="16"><use xlink:href="#icon-image"></use></svg>
                    画像
                </button>
                <button class="filter-tab" data-type="video">
                    <svg width="16" height="16"><use xlink:href="#icon-video"></use></svg>
                    動画
                </button>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="results-container">
            <!-- ローディング -->
            <div class="loading" id="loading" style="display: none;">
                <svg class="spinner-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="spinnerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#4F46E5" />
                            <stop offset="100%" style="stop-color:#7C3AED" />
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#spinnerGradient)" stroke-width="4" opacity="0.2"/>
                    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#spinnerGradient)" stroke-width="4" stroke-dasharray="60 190" class="spinner-circle"/>
                </svg>
                <p>検索中...</p>
            </div>

            <!-- 結果リスト -->
            <div class="results-list" id="resultsList"></div>

            <!-- エラーメッセージ -->
            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </div>

        <!-- ページネーション -->
        <div class="pagination" id="pagination"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
