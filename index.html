<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAN Search - シンプルな検索エンジン</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234F46E5'/><text x='50' y='65' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>D</text></svg>">
</head>
<body>
    <!-- ホームページ -->
    <div class="home-page" id="homePage">
        <div class="home-container">
            <!-- ロゴセクション -->
            <div class="logo-container">
                <h1 class="logo">DAN Search</h1>
                <p class="tagline">シンプルで高速な検索エンジン</p>
            </div>

            <!-- 検索ボックス -->
            <div class="search-wrapper">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="検索キーワードを入力..."
                        autocomplete="off"
                    >
                    <button class="clear-btn" id="clearBtn" style="display: none;" title="クリア">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- 検索ボタンとオプション -->
                <div class="search-controls">
                    <button class="search-btn" id="searchBtn">検索</button>
                    <button class="settings-btn" id="settingsBtn" title="設定">⚙</button>
                </div>
            </div>

            <!-- クイックリンク -->
            <div class="quick-links">
                <a href="#" class="quick-link" data-type="web">ウェブ</a>
                <a href="#" class="quick-link" data-type="image">画像</a>
                <a href="#" class="quick-link" data-type="video">動画</a>
            </div>

            <!-- フッター -->
            <footer class="home-footer">
                <button class="theme-toggle" id="themeToggle" title="テーマ切り替え">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </footer>
        </div>
    </div>

    <!-- 検索結果ページ -->
    <div class="results-page" id="resultsPage" style="display: none;">
        <!-- ヘッダー -->
        <header class="results-header">
            <div class="header-logo">
                <h1 class="logo-small">DAN</h1>
            </div>
            <div class="header-search">
                <div class="search-box-small">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input 
                        type="text" 
                        id="searchInputHeader" 
                        class="search-input-small" 
                        placeholder="検索..."
                        autocomplete="off"
                    >
                    <button class="search-btn-small" id="searchBtnHeader">検索</button>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggleResults" title="テーマ切り替え">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </header>

        <!-- 検索情報 -->
        <div class="search-info">
            <span id="resultStats"></span>
            <div class="filter-tabs">
                <button class="filter-tab active" data-type="web">全て</button>
                <button class="filter-tab" data-type="image">画像</button>
                <button class="filter-tab" data-type="video">動画</button>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="results-container">
            <!-- ローディング -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>検索中...</p>
            </div>

            <!-- 結果リスト -->
            <div class="results-list" id="resultsList"></div>

            <!-- エラーメッセージ -->
            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </div>

        <!-- ページネーション -->
        <div class="pagination" id="pagination"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
