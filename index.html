<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAN Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ホームページ -->
    <div class="home-page" id="homePage">
        <div class="home-wrapper">
            <!-- ロゴ -->
            <div class="logo-section">
                <svg class="logo" viewBox="0 0 120 50" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="40" font-size="48" font-weight="700" fill="#4F46E5" font-family="Arial, sans-serif">DAN</text>
                </svg>
            </div>

            <!-- 検索ボックス -->
            <div class="search-section">
                <div class="search-box-home">
                    <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="14" y1="14" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <input 
                        type="text" 
                        id="homeSearchInput" 
                        class="search-input-home" 
                        placeholder="Google検索の代わりに検索"
                        spellcheck="false"
                    >
                    <svg class="clear-icon" id="clearIconHome" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
            </div>

            <!-- ボタン -->
            <div class="button-section">
                <button class="btn-search" id="homeSearchBtn">検索</button>
                <button class="btn-lucky" id="homeLuckyBtn">ラッキーサーチ</button>
            </div>

            <!-- 言語切り替え -->
            <div class="footer-home">
                <a href="#" onclick="toggleTheme(); return false;">
                    <svg class="theme-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
                        <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
                        <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- 結果ページ -->
    <div class="results-page" id="resultsPage" style="display: none;">
        <!-- ヘッダー -->
        <header class="header">
            <div class="header-left">
                <svg class="logo-mini" viewBox="0 0 80 35" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="28" font-size="32" font-weight="700" fill="#4F46E5" font-family="Arial, sans-serif">DAN</text>
                </svg>
            </div>
            
            <div class="header-center">
                <div class="search-box-header">
                    <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="14" y1="14" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <input 
                        type="text" 
                        id="headerSearchInput" 
                        class="search-input-header" 
                        placeholder="検索"
                        spellcheck="false"
                    >
                </div>
            </div>

            <div class="header-right">
                <button class="btn-search-header" id="headerSearchBtn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="14" y1="14" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
                <button class="btn-back" id="backBtn" title="戻る">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
                <a href="#" class="theme-toggle" onclick="toggleTheme(); return false;">
                    <svg class="theme-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
                        <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
                        <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- フィルタータブ -->
        <div class="filter-section">
            <button class="filter-tab active" data-filter="web">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="14" y1="14" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
                </svg>
                全て
            </button>
            <button class="filter-tab" data-filter="image">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                    <polyline points="21 15 16 10 5 21" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                画像
            </button>
            <button class="filter-tab" data-filter="video">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <polygon points="18 12 10 16 10 8" fill="currentColor"/>
                </svg>
                動画
            </button>
        </div>

        <!-- 検索情報 -->
        <div class="result-info">
            <span id="resultCount"></span>
        </div>

        <!-- メインコンテンツ -->
        <main class="results-main">
            <!-- ローディング -->
            <div class="loading" id="loading" style="display: none;">
                <svg class="spinner" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                    <circle cx="25" cy="25" r="20" fill="none" stroke="#4F46E5" stroke-width="3" stroke-dasharray="50 190" class="spinner-circle"/>
                </svg>
            </div>

            <!-- 結果リスト -->
            <div id="resultsList"></div>

            <!-- エラー -->
            <div class="error-message" id="errorMessage" style="display: none;"></div>

            <!-- ページネーション -->
            <div class="pagination-section" id="paginationSection" style="display: none;">
                <div class="pagination">
                    <button class="pagination-btn" id="prevBtn" style="display: none;">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        前のページ
                    </button>
                    <button class="pagination-btn" id="nextBtn">
                        次のページ
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <polyline points="9 18 15 12 9 6" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
